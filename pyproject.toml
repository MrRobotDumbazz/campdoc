[project]
name = "campdoc"
version = "0.1.0"
description = "Campaign Doctor — verifiable AI agent that diagnoses and fixes underperforming ad campaigns (Meta Global AI Developer Hackathon 2026)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["backend*"] } }

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
